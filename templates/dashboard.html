<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/"><img src="/static/logo.png"><span><strong>NOORANIYAT</strong><small>ADMIN DASHBOARD</small></span></a><a class="btn outline" href="/admin/logout">Logout</a></header><main class="section"><h1>Patient Enquiries</h1><form style="display:flex;gap:10px;margin-bottom:25px"><input name="q" value="{{q}}" placeholder="Search name, phone or country"><button class="btn primary">Search</button></form><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>ID</th><th>Name</th><th>Country</th><th>Phone</th><th>Condition</th><th>Date</th></tr>{% for p in patients %}<tr><td>{{p.id}}</td><td><a style="color:#c92b8f;font-weight:700" href="/admin/patient/{{p.id}}">{{p.patient_name}}</a></td><td>{{p.country}}</td><td>{{p.phone}}</td><td>{{p.diagnosis}}</td><td>{{p.created_at}}</td></tr>{% endfor %}</table></div></main></body></html>
